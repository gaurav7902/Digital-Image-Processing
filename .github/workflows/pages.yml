name: Deploy course resource site

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Configure GitHub Pages
              id: pages
              uses: actions/configure-pages@v6

            - name: Prepare static site
              env:
                  PAGES_OUTPUT: ${{ runner.temp }}/digital-image-processing-pages
              run: |
                  mkdir -p "$PAGES_OUTPUT"
                  cp -R "Lab Practicals" Notes index.html robots.txt "$PAGES_OUTPUT/"

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ runner.temp }}/digital-image-processing-pages

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
