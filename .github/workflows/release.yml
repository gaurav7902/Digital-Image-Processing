name: Package course release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Check out tagged source
              uses: actions/checkout@v7

            - name: Package course files outside the checkout
              run: |
                  archive="$RUNNER_TEMP/Digital-Image-Processing.zip"
                  zip -r -X -9 "$archive" README.md index.html robots.txt Notes "Lab Practicals"
                  zip -T "$archive"
                  unzip -Z1 "$archive" | grep -Fxq "index.html"
                  unzip -Z1 "$archive" | grep -Fxq "Notes/"
                  unzip -Z1 "$archive" | grep -Fxq "Lab Practicals/"
                  echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

            - name: Create GitHub release and upload archive
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" "$ARCHIVE_PATH" \
                    --verify-tag \
                    --title "Digital Image Processing $GITHUB_REF_NAME" \
                    --generate-notes
